      tags:
        - CollectionService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The requested collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

    delete:
      summary: Delete a collection
      description: Deletes a collection by id.
      operationId: CollectionService_DeleteCollection
      tags:
        - CollectionService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Collection deleted
          content:
            application/json:
              schema:
                type: object
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  /api/v1/collections/{collection.id}:
    put:
      summary: Update a collection
      description: Updates an existing collection.
      operationId: CollectionService_UpdateCollection
      tags:
        - CollectionService
      parameters:
        - name: collection.id
          in: path
          required: true
          schema:
            type: integer
            format: int32
        - name: updateMask
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionUpdate'
      responses:
        '200':
          description: The updated collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  /api/v1/collections/import:
    post:
      summary: Import bookmarks
      description: Imports bookmarks from an HTML file and creates collections and shortcuts.
      operationId: CollectionService_ImportBookmarks
      tags:
        - CollectionService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportBookmarksRequest'
      responses:
        '200':
          description: Import results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBookmarksResponse'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  # Tag Service
  /api/v1/tags:
    get:
      summary: List tags
      description: Returns a list of tags.
      operationId: TagService_ListTags
      tags:
        - TagService
      responses:
        '200':
          description: A list of tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTagsResponse'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

    post:
      summary: Create a tag
      description: Creates a new tag.
      operationId: TagService_CreateTag
      tags:
        - TagService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tag'
      responses:
        '200':
          description: The created tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  /api/v1/tags/{uuid}:
    get:
      summary: Get a tag
      description: Returns a tag by uuid.
      operationId: TagService_GetTag
      tags:
        - TagService
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The requested tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

    delete:
      summary: Delete a tag
      description: Deletes a tag by uuid.
      operationId: TagService_DeleteTag
      tags:
        - TagService
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tag deleted
          content:
            application/json:
              schema:
                type: object
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  /api/v1/tags/abbr/{abbreviation}:
    get:
      summary: Get tag by abbreviation
      description: Returns a tag by abbreviation.
      operationId: TagService_GetTagByAbbreviation
      tags:
        - TagService
      parameters:
        - name: abbreviation
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The requested tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  /api/v1/tags/{tagUuid}/bookmarks/{shortcutId}:
    post:
      summary: Add bookmark to tag
      description: Adds a bookmark to a tag.
      operationId: TagService_AddBookmarkToTag
      tags:
        - TagService
      parameters:
        - name: tagUuid
          in: path
          required: true
          schema:
            type: string
        - name: shortcutId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Bookmark added to tag
          content:
            application/json:
              schema:
                type: object
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

    delete:
      summary: Remove bookmark from tag
      description: Removes a bookmark from a tag.
      operationId: TagService_RemoveBookmarkFromTag
      tags:
        - TagService
      parameters:
        - name: tagUuid
          in: path
          required: true
          schema:
            type: string
        - name: shortcutId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Bookmark removed from tag
          content:
            application/json:
              schema:
                type: object
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  # Activity Service
  /api/v1/activities:
    get:
      summary: List activities
      description: Returns a paginated list of activities with filtering.
      operationId: ActivityService_ListActivities
      tags:
        - ActivityService
      parameters:
        - name: activityType
          description: Activity type filter
          in: query
          required: false
          schema:
            type: string
            enum:
              - ACTIVITY_TYPE_UNSPECIFIED
              - USER_CREATED
              - SHORTCUT_CREATED
              - SHORTCUT_VIEWED
              - COLLECTION_CREATED
              - COLLECTION_VIEWED
        - name: userId
          description: User ID filter
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: createdAfter
          description: Time range filter start
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: createdBefore
          description: Time range filter end
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: pageSize
          description: Number of results per page
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: pageToken
          description: Token for next page
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A list of activities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListActivitiesResponse'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  /api/v1/activities/recent:
    get:
      summary: Get recent activity
      description: Returns recent activity data for the dashboard.
      operationId: ActivityService_GetRecentActivity
      tags:
        - ActivityService
      parameters:
        - name: limit
          description: Number of items to return for each activity type (default 5)
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 5
      responses:
        '200':
          description: Recent activity data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRecentActivityResponse'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  /api/v1/activities/summary:
    get:
      summary: Get activity summary
      description: Returns summary statistics for the workspace.
      operationId: ActivityService_GetActivitySummary
      tags:
        - ActivityService
      responses:
        '200':
          description: Activity summary statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetActivitySummaryResponse'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  # User Service
  /api/v1/users:
    get:
      summary: List users
      description: Returns a list of users.
      operationId: UserService_ListUsers
      tags:
        - UserService
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
        default:
