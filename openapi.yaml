  /api/v1/workspace/database/stats:
    get:
      summary: Get database statistics
      description: Returns database entity counts.
      operationId: WorkspaceService_GetDatabaseStats
      tags:
        - WorkspaceService
      responses:
        '200':
          description: Database statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseStats'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  /api/v1/workspace/database/export:
    post:
      summary: Export database
      description: Exports database entities to JSON.
      operationId: WorkspaceService_ExportDatabase
      tags:
        - WorkspaceService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportDatabaseRequest'
      responses:
        '200':
          description: Exported database data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportDatabaseResponse'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  /api/v1/workspace/database/import:
    post:
      summary: Import database
      description: Imports database entities from JSON.
      operationId: WorkspaceService_ImportDatabase
      tags:
        - WorkspaceService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportDatabaseRequest'
      responses:
        '200':
          description: Import results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportDatabaseResponse'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

components:
  schemas:
    # Core Models
    User:
      type: object
      properties:
        id:
          type: integer
          format: int32
        state:
          $ref: '#/components/schemas/State'
        createdTime:
          type: string
          format: date-time
        updatedTime:
          type: string
          format: date-time
        uuid:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        email:
          type: string
          format: email
        nickname:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
        profilePicture:
          type: string
        locale:
          type: string
        colorTheme:
          type: string
        defaultVisibility:
          type: string
        autoGenerateTitle:
          type: boolean
        autoGenerateIcon:
          type: boolean
        autoGenerateName:
          type: boolean
        editModePreference:
          type: string

    Shortcut:
      type: object
      properties:
        id:
          type: integer
          format: int32
        uuid:
          type: string
        creatorId:
          type: integer
          format: int32
        createdTime:
          type: string
          format: date-time
        updatedTime:
          type: string
          format: date-time
        name:
          type: string
          description: Human-readable shortcut name (e.g., "s/meeting")
        link:
          type: string
          format: uri
          description: Target URL
        title:
          type: string
          description: Display title
        tags:
          type: array
          items:
            type: string
        description:
          type: string
        visibility:
          $ref: '#/components/schemas/Visibility'
        viewCount:
          type: integer
          format: int32
        ogMetadata:
          $ref: '#/components/schemas/OpenGraphMetadata'
        userOrder:
          type: integer
          format: int32
        tagInfo:
          type: array
          items:
            $ref: '#/components/schemas/TagInfo'
        isFavorite:
          type: boolean
          description: Whether the user has marked this shortcut as a favorite
          default: false

    Collection:
      type: object
      properties:
        id:
          type: integer
          format: int32
        creatorId:
          type: integer
          format: int32
        createdTime:
          type: string
          format: date-time
        updatedTime:
          type: string
          format: date-time
        uuid:
          type: string
        name:
          type: string
        title:
          type: string
        description:
          type: string
        shortcutIds:
          type: array
          items:
            type: integer
            format: int32
        visibility:
          $ref: '#/components/schemas/Visibility'

    Tag:
      type: object
      properties:
        uuid:
          type: string
        creatorId:
          type: integer
          format: int32
        createdTime:
          type: string
          format: date-time
        updatedTime:
          type: string
          format: date-time
        name:
          type: string
        abbreviation:
          type: string
        description:
          type: string

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
          format: int32
        type:
          $ref: '#/components/schemas/ActivityType'
        userId:
          type: integer
          format: int32
        userName:
          type: string
        createdTime:
          type: string
          format: date-time
        userCreated:
          $ref: '#/components/schemas/UserCreatedData'
        shortcutCreated:
          $ref: '#/components/schemas/ShortcutCreatedData'
        shortcutViewed:
          $ref: '#/components/schemas/ShortcutViewedData'
        collectionCreated:
          $ref: '#/components/schemas/CollectionCreatedData'
        collectionViewed:
          $ref: '#/components/schemas/CollectionViewedData'

    WorkspaceProfile:
      type: object
      properties:
        mode:
          type: string
          description: Current workspace mode (dev, prod)
        version:
          type: string
          description: Current workspace version
        owner:
          type: string
          description: The owner name (format "users/{id}")
        subscription:
          $ref: '#/components/schemas/Subscription'
        customStyle:
          type: string
        branding:
          type: string
          format: byte

    WorkspaceSetting:
      type: object
      properties:
        instanceUrl:
          type: string
          format: uri
        branding:
          type: string
          format: byte
        customStyle:
          type: string
        defaultVisibility:
          $ref: '#/components/schemas/Visibility'
        identityProviders:
          type: array
          items:
            $ref: '#/components/schemas/IdentityProvider'
        disallowUserRegistration:
          type: boolean
        disallowPasswordAuth:
          type: boolean
        shortcutPrefix:
          type: string
          description: Prefix for shortcut URLs (e.g., "s")

    # Enums
    Role:
      type: string
      enum:
        - ROLE_UNSPECIFIED
        - ADMIN
        - USER
      default: ROLE_UNSPECIFIED

    State:
      type: string
      enum:
        - STATE_UNSPECIFIED
        - ACTIVE
        - INACTIVE
      default: STATE_UNSPECIFIED

    Visibility:
      type: string
      enum:
        - VISIBILITY_UNSPECIFIED
        - WORKSPACE
        - PUBLIC
        - PRIVATE
        - FRIENDS
      default: VISIBILITY_UNSPECIFIED

    ActivityType:
      type: string
      enum:
        - ACTIVITY_TYPE_UNSPECIFIED
        - USER_CREATED
        - SHORTCUT_CREATED
        - SHORTCUT_VIEWED
        - COLLECTION_CREATED
        - COLLECTION_VIEWED
      default: ACTIVITY_TYPE_UNSPECIFIED

    # Response Models
    ListShortcutsResponse:
      type: object
      properties:
        shortcuts:
          type: array
          items:
            $ref: '#/components/schemas/Shortcut'
        totalCount:
          type: integer
          format: int32
        hasMore:
          type: boolean

    ListCollectionsResponse:
      type: object
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/Collection'

    ListTagsResponse:
      type: object
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'

    ListActivitiesResponse:
      type: object
      properties:
        activities:
          type: array
          items:
            $ref: '#/components/schemas/ActivityItem'
        nextPageToken:
          type: string
        totalCount:
          type: integer
          format: int32

    ListUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'

    GetShortcutAnalyticsResponse:
      type: object
      properties:
        references:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsItem'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsItem'
        browsers:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsItem'

    GetRecentActivityResponse:
      type: object
      properties:
        recentUsers:
          type: array
          items:
            $ref: '#/components/schemas/RecentUser'
        recentShortcuts:
          type: array
          items:
            $ref: '#/components/schemas/RecentShortcut'
        recentCollections:
          type: array
          items:
            $ref: '#/components/schemas/RecentCollection'
        recentClicks:
          type: array
          items:
            $ref: '#/components/schemas/RecentClick'
        mostClickedShortcuts:
          type: array
          items:
            $ref: '#/components/schemas/MostClickedShortcut'

    GetActivitySummaryResponse:
      type: object
      properties:
        totalUsers:
          type: integer
          format: int32
        totalShortcuts:
          type: integer
          format: int32
        totalCollections:
          type: integer
          format: int32
        totalClicks:
          type: integer
          format: int32
        recentUsersCount:
          type: integer
          format: int32
        recentShortcutsCount:
          type: integer
          format: int32
        recentCollectionsCount:
          type: integer
          format: int32
        recentClicksCount:
          type: integer
          format: int32
        userSummary:
          $ref: '#/components/schemas/UserSummary'

    WorkspaceStats:
      type: object
      properties:
        totalShortcuts:
          type: integer
          format: int32
        totalUsers:
          type: integer
          format: int32
        totalCollections:
          type: integer
          format: int32
        totalHits:
          type: integer
          format: int32
        historicalData:
          type: array
          items:
            $ref: '#/components/schemas/StatsMeasurement'

    DatabaseStats:
      type: object
      properties:
        users:
          type: integer
          format: int32
        shortcuts:
          type: integer
          format: int32
        collections:
          type: integer
          format: int32
        tags:
          type: integer
          format: int32
        bookmarkTags:
          type: integer
          format: int32
        friendships:
          type: integer
          format: int32
        followings:
          type: integer
          format: int32
        activities:
          type: integer
          format: int32
        invitations:
          type: integer
          format: int32

    ImportBookmarksRequest:
      type: object
      properties:
        htmlContent:
          type: string
          description: HTML content from browser bookmarks export

    ImportBookmarksResponse:
      type: object
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
        totalShortcuts:
          type: integer
          format: int32
        totalCollections:
          type: integer
          format: int32
        shortcutsCreated:
          type: integer
          format: int32
        shortcutsUpdated:
          type: integer
          format: int32
        collectionsCreated:
          type: integer
          format: int32
        collectionsUpdated:
          type: integer
          format: int32

    ExportDatabaseRequest:
      type: object
      properties:
        entities:
          type: array
          items:
            type: string
          description: List of entity types to export

    ExportDatabaseResponse:
      type: object
      properties:
        data:
          type: string
          description: JSON data containing the exported entities
        filename:
          type: string

    ImportDatabaseRequest:
      type: object
      properties:
        data:
          type: string
          description: JSON data to import
        entities:
          type: array
          items:
            type: string
          description: List of entity types to import
        mode:
          type: string
          enum:
            - new-only
            - overwrite
            - wipe-and-import
          description: Import mode

    ImportDatabaseResponse:
      type: object
      properties:
        importedCounts:
          type: object
          additionalProperties:
            type: integer
            format: int32
          description: Number of records imported per entity type
        messages:
          type: array
          items:
            type: string
          description: Any warnings or messages

    # Supporting Models
    OpenGraphMetadata:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        image:
          type: string
          format: uri

    TagInfo:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string

    AnalyticsItem:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer
          format: int32

    RecentUser:
      type: object
      properties:
        id:
          type: integer
          format: int32
        email:
          type: string
        nickname:
          type: string
        createdTime:
          type: string
          format: date-time
        role:
          $ref: '#/components/schemas/Role'

    RecentShortcut:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        title:
          type: string
        link:
          type: string
        creatorId:
          type: integer
          format: int32
        creatorName:
          type: string
        createdTime:
          type: string
          format: date-time
        viewCount:
          type: integer
          format: int32
        tags:
          type: array
          items:
            type: string

    RecentCollection:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        title:
          type: string
        description:
          type: string
        creatorId:
          type: integer
          format: int32
        creatorName:
          type: string
        createdTime:
          type: string
          format: date-time
        shortcutCount:
          type: integer
          format: int32

    RecentClick:
      type: object
      properties:
        shortcutId:
          type: integer
          format: int32
        shortcutName:
          type: string
        shortcutTitle:
          type: string
        shortcutLink:
          type: string
        creatorId:
          type: integer
          format: int32
        creatorName:
          type: string
        clickedTime:
          type: string
          format: date-time
        userAgent:
          type: string
        referer:
          type: string

    MostClickedShortcut:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        title:
          type: string
        link:
          type: string
        creatorId:
          type: integer
          format: int32
        creatorName:
          type: string
        viewCount:
          type: integer
          format: int32
        lastClicked:
          type: string
          format: date-time

    UserSummary:
      type: object
      properties:
        userShortcutsCount:
          type: integer
          format: int32
        userCollectionsCount:
          type: integer
          format: int32
        userTotalClicks:
          type: integer
          format: int32
        userTags:
          type: array
          items:
            type: string

    StatsMeasurement:
      type: object
      properties:
        measuredTs:
          type: string
          format: int64
          description: Unix timestamp
        shortcutsCount:
          type: integer
          format: int32
        usersCount:
          type: integer
          format: int32
        collectionsCount:
          type: integer
          format: int32
        hitsCount:
          type: integer
          format: int32

    UserCreatedData:
      type: object
      properties:
        userId:
          type: integer
          format: int32
        email:
          type: string
        nickname:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    ShortcutCreatedData:
      type: object
      properties:
        shortcutId:
          type: integer
          format: int32
        name:
          type: string
        title:
          type: string
        link:
          type: string

    ShortcutViewedData:
      type: object
      properties:
        shortcutId:
          type: integer
          format: int32
        name:
          type: string
        title:
          type: string
        userAgent:
          type: string
        referer:
          type: string

    CollectionCreatedData:
      type: object
      properties:
        collectionId:
          type: integer
          format: int32
        name:
          type: string
        title:
          type: string
        description:
          type: string

    CollectionViewedData:
      type: object
      properties:
        collectionId:
          type: integer
          format: int32
        name:
          type: string
        title:
          type: string

    Subscription:
      type: object
      properties:
        plan:
          $ref: '#/components/schemas/PlanType'
        startedTime:
          type: string
          format: date-time
        expiresTime:
          type: string
          format: date-time
        features:
          type: array
          items:
            type: string
        seats:
          type: integer
          format: int32
        shortcutsLimit:
          type: integer
          format: int32
        collectionsLimit:
          type: integer
          format: int32

    PlanType:
      type: string
      enum:
        - PLAN_TYPE_UNSPECIFIED
        - FREE
        - PRO
        - ENTERPRISE
      default: PLAN_TYPE_UNSPECIFIED

    IdentityProvider:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        type:
          $ref: '#/components/schemas/IdentityProviderType'
        config:
          $ref: '#/components/schemas/IdentityProviderConfig'

    IdentityProviderType:
      type: string
      enum:
        - TYPE_UNSPECIFIED
        - OAUTH2
      default: TYPE_UNSPECIFIED

    IdentityProviderConfig:
      type: object
      properties:
        oauth2:
          $ref: '#/components/schemas/OAuth2Config'

    OAuth2Config:
      type: object
      properties:
        clientId:
          type: string
        clientSecret:
          type: string
        authUrl:
          type: string
        tokenUrl:
          type: string
        userInfoUrl:
          type: string
        scopes:
          type: array
          items:
            type: string
        fieldMapping:
          $ref: '#/components/schemas/FieldMapping'

    FieldMapping:
      type: object
      properties:
        identifier:
          type: string
        displayName:
          type: string

    ShortcutUpdate:
      type: object
      properties:
        uuid:
          type: string
        creatorId:
          type: integer
          format: int32
        createdTime:
          type: string
          format: date-time
        updatedTime:
          type: string
          format: date-time
        name:
          type: string
        link:
          type: string
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        description:
          type: string
        visibility:
          $ref: '#/components/schemas/Visibility'
        viewCount:
          type: integer
          format: int32
        ogMetadata:
          $ref: '#/components/schemas/OpenGraphMetadata'
        userOrder:
          type: integer
          format: int32
        tagInfo:
          type: array
          items:
            $ref: '#/components/schemas/TagInfo'
        isFavorite:
          type: boolean
          description: Whether the user has marked this shortcut as a favorite

    CollectionUpdate:
      type: object
      properties:
        creatorId:
          type: integer
          format: int32
        createdTime:
          type: string
          format: date-time
        updatedTime:
          type: string
          format: date-time
        uuid:
          type: string
        name:
          type: string
        title:
          type: string
        description:
          type: string
        shortcutIds:
          type: array
          items:
            type: integer
            format: int32
        visibility:
          $ref: '#/components/schemas/Visibility'

    # Error Model
    Status:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: true

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Session-based authentication using cookies

security:
  - cookieAuth: []
