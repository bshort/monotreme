          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  /api/v1/workspace/profile:
    get:
      summary: Get workspace profile
      description: Returns the workspace profile information.
      operationId: WorkspaceService_GetWorkspaceProfile
      tags:
        - WorkspaceService
      responses:
        '200':
          description: Workspace profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceProfile'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  /api/v1/workspace/setting:
    get:
      summary: Get workspace settings
      description: Returns the workspace settings.
      operationId: WorkspaceService_GetWorkspaceSetting
      tags:
        - WorkspaceService
      responses:
        '200':
          description: Workspace settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSetting'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

    patch:
      summary: Update workspace settings
      description: Updates the workspace settings.
      operationId: WorkspaceService_UpdateWorkspaceSetting
      tags:
        - WorkspaceService
      requestBody:
        required: true
        content:
          application/json:
            schema:
