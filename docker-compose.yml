services:
  monotreme:
    image: monotreme:local
    container_name: monotreme
    ports:
      - 5231:5231
    environment:
      - REDIS_ENABLED=true
      - REDIS_HOST=monotreme-redis
      - REDIS_PORT=6379
    volumes:
      - /Primer/Media/data/monotreme:/var/opt/monotreme
#      - ./data:/var/opt/monotreme
    restart: unless-stopped
    networks:
      macvlan_network:
# Keep commented out until docker pulls an IP that's available
#        ipv4_address: 192.168.1.136
        ipv4_address: ${MONOTREME_IP}
      monotreme-network:
    depends_on:
      - monotreme-redis

  monotreme-redis:
    image: redis:7-alpine
    container_name: monotreme-redis
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - monotreme-network
    command: redis-server --appendonly yes

networks:
  monotreme-network:
    driver: bridge
  macvlan_network:
    name: MyMacVlan
    external: true

volumes:
  redis-data:
