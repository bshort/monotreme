syntax = "proto3";

package monotreme.api.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "gen/api/v1";

service InvitationService {
  // ListInvitations returns a list of invitations.
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse) {
    option (google.api.http) = {get: "/api/v1/invitations"};
  }
  // GetInvitation returns an invitation by id.
  rpc GetInvitation(GetInvitationRequest) returns (Invitation) {
    option (google.api.http) = {get: "/api/v1/invitations/{id}"};
    option (google.api.method_signature) = "id";
  }
  // CreateInvitation creates an invitation.
  rpc CreateInvitation(CreateInvitationRequest) returns (Invitation) {
    option (google.api.http) = {
      post: "/api/v1/invitations"
      body: "invitation"
    };
  }
  // AcceptInvitation accepts an invitation.
  rpc AcceptInvitation(AcceptInvitationRequest) returns (Invitation) {
    option (google.api.http) = {
      post: "/api/v1/invitations/{id}/accept"
      body: "*"
    };
    option (google.api.method_signature) = "id";
  }
  // DeleteInvitation deletes an invitation by id.
  rpc DeleteInvitation(DeleteInvitationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/invitations/{id}"};
    option (google.api.method_signature) = "id";
  }
}

message Invitation {
  int32 id = 1;

  google.protobuf.Timestamp created_time = 2;

  google.protobuf.Timestamp updated_time = 3;

  string from = 4;  // Path to inviting user: "/users/[uuid]"

  string to = 5;    // Path to invited user: "/users/[uuid]"

  string accepted_at = 6;  // ISO 8601 datetime string

  string deleted_at = 7;   // ISO 8601 datetime string
}

message ListInvitationsRequest {
  // Optional filter by from user path
  string from = 1;

  // Optional filter by to user path
  string to = 2;

  // Optional filter by accepted status
  optional bool accepted = 3;

  // Optional filter by deleted status
  optional bool deleted = 4;
}

message ListInvitationsResponse {
  repeated Invitation invitations = 1;
}

message GetInvitationRequest {
  int32 id = 1;
}

message CreateInvitationRequest {
  Invitation invitation = 1;
}

message AcceptInvitationRequest {
  int32 id = 1;
}

message DeleteInvitationRequest {
  int32 id = 1;
}