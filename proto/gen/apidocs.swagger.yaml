            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: rssFeed
          in: body
          required: true
          schema:
            $ref: '#/definitions/apiv1RssFeed'
      tags:
        - RssImportService
  /api/v1/rss-feeds/{id}:
