        - RssImportService
  /api/v1/rss-feeds/{rssFeed.id}:
    put:
      summary: UpdateRssFeed updates an RSS feed.
      operationId: RssImportService_UpdateRssFeed
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/apiv1RssFeed'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: rssFeed.id
          in: path
          required: true
          type: integer
          format: int32
        - name: rssFeed
          in: body
          required: true
          schema:
            type: object
            properties:
              creatorId:
                type: integer
                format: int32
              createdTime:
                type: string
                format: date-time
              updatedTime:
                type: string
                format: date-time
              title:
                type: string
              url:
                type: string
              description:
                type: string
              autoImport:
                type: boolean
                title: Import settings
              importFrequencyHours:
                type: integer
                format: int32
                title: How often to check for updates (in hours)
              lastImportTime:
                type: string
                format: date-time
              defaultTags:
                type: array
                items:
                  type: string
                title: Shortcut generation settings
              defaultVisibility:
                $ref: '#/definitions/apiv1Visibility'
              shortcutPrefix:
                type: string
                title: Optional prefix for generated shortcut names
              isActive:
                type: boolean
                title: Status
              lastError:
                type: string
              totalImported:
                type: integer
                format: int32
        - name: updateMask
          in: query
          required: false
          type: string
      tags:
