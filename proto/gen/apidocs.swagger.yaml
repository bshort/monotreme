swagger: "2.0"
info:
  title: api/v1/common.proto
  version: version not set
tags:
  - name: UserService
  - name: ActivityService
  - name: AuthService
  - name: CollectionService
  - name: ShortcutService
  - name: FollowService
  - name: FriendService
  - name: InvitationService
  - name: RssImportService
  - name: SubscriptionService
  - name: TagService
  - name: UserSettingService
  - name: WorkspaceService
consumes:
  - application/json
produces:
  - application/json
paths:
  /api/v1/activities:
    get:
      summary: ListActivities returns a paginated list of activities with filtering
      operationId: ActivityService_ListActivities
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListActivitiesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: activityType
          description: Activity type filter
          in: query
          required: false
          type: string
          enum:
            - ACTIVITY_TYPE_UNSPECIFIED
            - USER_CREATED
            - SHORTCUT_CREATED
            - SHORTCUT_VIEWED
            - COLLECTION_CREATED
            - COLLECTION_VIEWED
          default: ACTIVITY_TYPE_UNSPECIFIED
        - name: userId
          description: User ID filter (if not specified, returns activities for all users)
          in: query
          required: false
          type: integer
          format: int32
        - name: createdAfter
          description: Time range filter
          in: query
          required: false
          type: string
          format: date-time
        - name: createdBefore
          in: query
          required: false
          type: string
          format: date-time
        - name: pageSize
          description: Pagination
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          in: query
          required: false
          type: string
      tags:
        - ActivityService
  /api/v1/activities/recent:
    get:
      summary: GetRecentActivity returns recent activity data for the dashboard
      operationId: ActivityService_GetRecentActivity
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetRecentActivityResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: limit
          description: 'Number of items to return for each activity type (default: 5)'
          in: query
          required: false
          type: integer
          format: int32
      tags:
        - ActivityService
  /api/v1/activities/summary:
    get:
      summary: GetActivitySummary returns summary statistics for the workspace
      operationId: ActivityService_GetActivitySummary
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetActivitySummaryResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
        - ActivityService
  /api/v1/auth/signin:
    post:
      summary: SignIn signs in the user with the given username and password.
      operationId: AuthService_SignIn
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1User'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: email
          in: query
          required: false
          type: string
        - name: password
          in: query
          required: false
          type: string
      tags:
        - AuthService
  /api/v1/auth/signin/sso:
    post:
      summary: SignInWithSSO signs in the user with the given SSO code.
      operationId: AuthService_SignInWithSSO
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1User'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: idpId
          description: The id of the SSO provider.
          in: query
          required: false
          type: string
        - name: code
          description: The code to sign in with.
          in: query
          required: false
          type: string
        - name: redirectUri
          description: The redirect URI.
          in: query
          required: false
          type: string
      tags:
        - AuthService
  /api/v1/auth/signout:
    post:
      summary: SignOut signs out the user.
      operationId: AuthService_SignOut
      responses:
        "200":
          description: A successful response.
          schema:
            type: object
            properties: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
        - AuthService
  /api/v1/auth/signup:
    post:
      summary: SignUp signs up the user with the given username and password.
      operationId: AuthService_SignUp
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1User'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: email
          in: query
          required: false
          type: string
        - name: nickname
          in: query
          required: false
          type: string
        - name: password
          in: query
          required: false
          type: string
        - name: invitationCode
          in: query
          required: false
          type: string
      tags:
        - AuthService
  /api/v1/auth/status:
    post:
      summary: GetAuthStatus returns the current auth status of the user.
      operationId: AuthService_GetAuthStatus
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1User'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
        - AuthService
  /api/v1/bookmarks/{shortcutId}/tags:
    get:
      summary: ListTagsForBookmark lists all tags for a bookmark.
      operationId: TagService_ListTagsForBookmark
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListTagsForBookmarkResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: shortcutId
          in: path
          required: true
          type: integer
          format: int32
      tags:
        - TagService
  /api/v1/collections:
    get:
      summary: ListCollections returns a list of collections.
      operationId: CollectionService_ListCollections
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListCollectionsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
        - CollectionService
    post:
      summary: CreateCollection creates a collection.
      operationId: CollectionService_CreateCollection
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/apiv1Collection'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: collection
          in: body
          required: true
          schema:
            $ref: '#/definitions/apiv1Collection'
      tags:
        - CollectionService
  /api/v1/collections/import:
    post:
      summary: ImportBookmarks imports bookmarks from an HTML file and creates collections and shortcuts.
      operationId: CollectionService_ImportBookmarks
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ImportBookmarksResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1ImportBookmarksRequest'
      tags:
        - CollectionService
  /api/v1/collections/{collection.id}:
    put:
      summary: UpdateCollection updates a collection.
      operationId: CollectionService_UpdateCollection
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/apiv1Collection'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: collection.id
          in: path
          required: true
          type: integer
          format: int32
        - name: collection
          in: body
          required: true
          schema:
            type: object
            properties:
              creatorId:
                type: integer
                format: int32
              createdTime:
                type: string
                format: date-time
              updatedTime:
                type: string
                format: date-time
              uuid:
                type: string
              name:
                type: string
              title:
                type: string
              description:
                type: string
              shortcutIds:
                type: array
                items:
                  type: integer
                  format: int32
              visibility:
                $ref: '#/definitions/apiv1Visibility'
        - name: updateMask
          in: query
          required: false
          type: string
      tags:
        - CollectionService
  /api/v1/collections/{id}:
    get:
      summary: GetCollection returns a collection by id.
      operationId: CollectionService_GetCollection
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/apiv1Collection'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          format: int32
      tags:
        - CollectionService
    delete:
      summary: DeleteCollection deletes a collection by id.
      operationId: CollectionService_DeleteCollection
      responses:
        "200":
          description: A successful response.
          schema:
            type: object
            properties: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          format: int32
      tags:
        - CollectionService
  /api/v1/followers:
    get:
      summary: ListFollowers lists all users following the current user
      operationId: FollowService_ListFollowers
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListFollowersResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
        - FollowService
  /api/v1/following:
    get:
      summary: ListFollowing lists all users that the current user is following
      operationId: FollowService_ListFollowing
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListFollowingResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
        - FollowService
    post:
      summary: FollowUser follows a user
      operationId: FollowService_FollowUser
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Following'
        default:
          description: An unexpected error response.
          schema:
