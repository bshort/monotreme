services:
  monotreme:
    volumes:
#      - ./data:/var/opt/monotreme
      - /Primer/Media/data/monotreme:/var/opt/monotreme
    restart: unless-stopped
    networks:
      macvlan_network:
# Keep commented out until docker pulls an IP that's available
        ipv4_address: 192.168.1.136

  monotreme-redis:
    networks:
      macvlan_network:
# Keep commented out until docker pulls an IP that's available
        ipv4_address: 192.168.1.137

networks:
  macvlan_network:
    name: MyMacVlan
    external: true
