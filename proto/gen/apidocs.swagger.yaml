      tags:
        - InvitationService
  /api/v1/invitations/{id}:
    get:
      summary: GetInvitation returns an invitation by id.
      operationId: InvitationService_GetInvitation
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/apiv1Invitation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          format: int32
      tags:
        - InvitationService
    delete:
      summary: DeleteInvitation deletes an invitation by id.
      operationId: InvitationService_DeleteInvitation
      responses:
        "200":
          description: A successful response.
          schema:
            type: object
            properties: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          format: int32
      tags:
