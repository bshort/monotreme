  /api/v1/friends:
    get:
      summary: ListFriends returns a list of friends for the current user.
      operationId: FriendService_ListFriends
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListFriendsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
        - FriendService
    post:
      summary: SendFriendRequest sends a friend request to another user.
      operationId: FriendService_SendFriendRequest
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Friendship'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1SendFriendRequestRequest'
      tags:
        - FriendService
  /api/v1/friends/requests:
    get:
      summary: ListFriendRequests returns a list of pending friend requests.
      operationId: FriendService_ListFriendRequests
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListFriendRequestsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: type
          in: query
          required: false
          type: string
          enum:
            - REQUEST_TYPE_ALL
            - REQUEST_TYPE_INCOMING
            - REQUEST_TYPE_OUTGOING
          default: REQUEST_TYPE_ALL
      tags:
        - FriendService
  /api/v1/friends/{id}:
    delete:
      summary: RemoveFriend removes a friend or declines a friend request.
      operationId: FriendService_RemoveFriend
      responses:
        "200":
          description: A successful response.
          schema:
            type: object
            properties: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          format: int32
      tags:
        - FriendService
  /api/v1/friends/{id}/accept:
    post:
      summary: AcceptFriendRequest accepts a pending friend request.
      operationId: FriendService_AcceptFriendRequest
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Friendship'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          format: int32
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/FriendServiceAcceptFriendRequestBody'
      tags:
        - FriendService
  /api/v1/invitations:
    get:
      summary: ListInvitations returns a list of invitations.
      operationId: InvitationService_ListInvitations
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListInvitationsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: from
          description: Optional filter by from user path
          in: query
          required: false
          type: string
        - name: to
          description: Optional filter by to user path
          in: query
          required: false
          type: string
        - name: accepted
          description: Optional filter by accepted status
          in: query
          required: false
          type: boolean
        - name: deleted
          description: Optional filter by deleted status
          in: query
          required: false
          type: boolean
      tags:
        - InvitationService
    post:
      summary: CreateInvitation creates an invitation.
      operationId: InvitationService_CreateInvitation
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/apiv1Invitation'
