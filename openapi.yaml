          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

    post:
      summary: Create a user
      description: Creates a new user.
      operationId: UserService_CreateUser
      tags:
        - UserService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: The created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  /api/v1/users/{id}:
    get:
      summary: Get a user
      description: Returns a user by id.
      operationId: UserService_GetUser
      tags:
        - UserService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The requested user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

    delete:
      summary: Delete a user
      description: Deletes a user by id.
      operationId: UserService_DeleteUser
      tags:
        - UserService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                type: object
        default:
