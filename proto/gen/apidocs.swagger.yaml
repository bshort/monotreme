            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          format: int32
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/InvitationServiceAcceptInvitationBody'
      tags:
        - InvitationService
  /api/v1/rss-feeds:
    get:
      summary: ListRssFeeds returns a list of RSS feeds.
      operationId: RssImportService_ListRssFeeds
      responses:
        "200":
          description: A successful response.
          schema:
