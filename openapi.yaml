openapi: 3.0.3
info:
  title: Monotreme API
  version: 1.0.0
  description: |
    **Monotreme** is an open source, self-hosted platform designed to help you organize, manage, and share your most important links.
    Easily create customizable, human-readable shortcuts to streamline your link management.

    ## Features
    - Create customizable `s/` short links for any URL
    - Share short links public or only with your teammates
    - View analytics on link traffic and sources
    - Easy access to your shortcuts with browser extension
    - Share your shortcuts with Collection to anyone, on any browser
    - Open source self-hosted solution

    ## Authentication
    Most endpoints require authentication via session cookies. Use the `/api/v1/auth/signin` endpoint to authenticate.
  contact:
    name: Monotreme Project
    url: https://github.com/bshort/monotreme
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:5231
    description: Local development server
  - url: https://api.example.com
    description: Production server (configure your own)

tags:
  - name: AuthService
    description: Authentication and authorization endpoints
  - name: UserService
    description: User management operations
  - name: ShortcutService
    description: Shortcut (bookmark) management and analytics
  - name: CollectionService
    description: Collection management and bookmark imports
  - name: TagService
    description: Tag management and bookmark-tag relationships
  - name: ActivityService
    description: Activity tracking and analytics
  - name: WorkspaceService
    description: Workspace configuration and statistics
  - name: UserSettingService
    description: User settings and preferences
  - name: FollowService
    description: User following relationships
  - name: FriendService
    description: Friend requests and friendship management
  - name: InvitationService
    description: User invitation management
  - name: RssImportService
    description: RSS feed imports and management
  - name: SubscriptionService
    description: Subscription and licensing management

paths:
  # Auth Service
  /api/v1/auth/signin:
    post:
      summary: Sign in with email and password
      description: Signs in the user with the given username and password.
      operationId: AuthService_SignIn
      tags:
        - AuthService
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
        - name: password
          in: query
          required: false
          schema:
            type: string
            format: password
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  /api/v1/auth/signin/sso:
    post:
      summary: Sign in with SSO
      description: Signs in the user with the given SSO code.
      operationId: AuthService_SignInWithSSO
      tags:
        - AuthService
      parameters:
        - name: idpId
          description: The id of the SSO provider
          in: query
          required: false
          schema:
            type: string
        - name: code
          description: The code to sign in with
          in: query
          required: false
          schema:
            type: string
        - name: redirectUri
          description: The redirect URI
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful SSO authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  /api/v1/auth/signout:
    post:
      summary: Sign out
      description: Signs out the current user.
      operationId: AuthService_SignOut
      tags:
        - AuthService
      responses:
        '200':
          description: Successfully signed out
          content:
            application/json:
              schema:
                type: object
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  /api/v1/auth/signup:
    post:
      summary: Sign up a new user
      description: Signs up the user with the given username and password.
      operationId: AuthService_SignUp
      tags:
        - AuthService
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
        - name: nickname
          in: query
          required: false
          schema:
            type: string
        - name: password
          in: query
          required: false
          schema:
            type: string
            format: password
        - name: invitationCode
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: User successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  /api/v1/auth/status:
    post:
      summary: Get authentication status
      description: Returns the current auth status of the user.
      operationId: AuthService_GetAuthStatus
      tags:
        - AuthService
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  # Shortcut Service
  /api/v1/shortcuts:
    get:
      summary: List shortcuts
      description: Returns a list of shortcuts with pagination support.
      operationId: ShortcutService_ListShortcuts
      tags:
        - ShortcutService
      parameters:
        - name: limit
          description: Maximum number of shortcuts to return (default 50)
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 50
        - name: offset
          description: Number of shortcuts to skip for pagination
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
      responses:
        '200':
          description: A list of shortcuts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListShortcutsResponse'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

    post:
      summary: Create a shortcut
      description: Creates a new shortcut.
      operationId: ShortcutService_CreateShortcut
      tags:
        - ShortcutService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Shortcut'
      responses:
        '200':
          description: The created shortcut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shortcut'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

    delete:
      summary: Delete all shortcuts
      description: Deletes all shortcuts for the current user.
      operationId: ShortcutService_DeleteAllShortcuts
      tags:
        - ShortcutService
      responses:
        '200':
          description: All shortcuts deleted
          content:
            application/json:
              schema:
                type: object
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  /api/v1/shortcuts/{id}:
    get:
      summary: Get a shortcut
      description: Returns a shortcut by id.
      operationId: ShortcutService_GetShortcut
      tags:
        - ShortcutService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The requested shortcut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shortcut'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

    delete:
      summary: Delete a shortcut
      description: Deletes a shortcut by id.
      operationId: ShortcutService_DeleteShortcut
      tags:
        - ShortcutService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Shortcut deleted
          content:
            application/json:
              schema:
                type: object
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  /api/v1/shortcuts/{shortcut.id}:
    put:
      summary: Update a shortcut
      description: Updates an existing shortcut.
      operationId: ShortcutService_UpdateShortcut
      tags:
        - ShortcutService
      parameters:
        - name: shortcut.id
          in: path
          required: true
          schema:
            type: integer
            format: int32
        - name: updateMask
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShortcutUpdate'
      responses:
        '200':
          description: The updated shortcut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shortcut'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  /api/v1/shortcuts/{id}/analytics:
    get:
      summary: Get shortcut analytics
      description: Returns the analytics for a shortcut.
      operationId: ShortcutService_GetShortcutAnalytics
      tags:
        - ShortcutService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Shortcut analytics data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetShortcutAnalyticsResponse'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

