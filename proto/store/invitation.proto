syntax = "proto3";

package monotreme.store;

option go_package = "gen/store";

message Invitation {
  int32 id = 1;

  int64 created_ts = 2;

  int64 updated_ts = 3;

  string from = 4;  // Path to inviting user: "/users/[uuid]"

  string to = 5;    // Path to invited user: "/users/[uuid]"

  string accepted_at = 6;  // ISO 8601 datetime string

  string deleted_at = 7;   // ISO 8601 datetime string
}