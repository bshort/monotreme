            type: object
            properties: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          format: int32
      tags:
        - RssImportService
  /api/v1/rss-feeds/{id}/import:
    post:
      summary: TriggerRssFeedImport manually triggers an import for an RSS feed.
      operationId: RssImportService_TriggerRssFeedImport
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1RssFeedImportResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          format: int32
