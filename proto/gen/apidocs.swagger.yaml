          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          format: int32
      tags:
        - FollowService
  /api/v1/following/{userId}/shortcuts:
    get:
      summary: ListFollowingUserShortcuts lists public shortcuts from users the current user is following
